<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Mooving CRM</title>

<style>
:root{
  --bg:#f8fafc;
  --card-bg:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --sidebar-bg:#0f172a;
  --sidebar-txt:#f8fafc;
  --sidebar-active:#1e293b;
  --sidebar-accent:#38bdf8;
  --navy:#1f4e79;
  --navy-dark:#163a5c;
  --red:#e2131f;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --success:#16a34a;
  --success-bg:#f0fdf4;
  --warn:#d97706;
  --warn-bg:#fffbeb;
  --badge-pending-bg:#fef3c7;
  --badge-pending-txt:#92400e;
  --badge-progress-bg:#dbeafe;
  --badge-progress-txt:#1e40af;
  --badge-complete-bg:#dcfce7;
  --badge-complete-txt:#166534;
}

[data-theme="dark"]{
  --bg:#0f172a;
  --card-bg:#1e293b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#334155;
  --sidebar-bg:#090d16;
  --sidebar-txt:#f8fafc;
  --sidebar-active:#1e293b;
  --sidebar-accent:#38bdf8;
  --navy:#38bdf8;
  --navy-dark:#0284c7;
  --danger-bg:#451a1a;
  --success-bg:#14532d;
  --warn-bg:#451a03;
  --badge-pending-bg:#451a03;
  --badge-pending-txt:#fde68a;
  --badge-progress-bg:#172554;
  --badge-progress-txt:#bfdbfe;
  --badge-complete-bg:#052e16;
  --badge-complete-txt:#86efac;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, -apple-system, sans-serif; }

body{ background:var(--bg); color:var(--text); transition:background .3s,color .3s; display:flex; min-height:100vh; }

/* ---------- Sidebar Navigation ---------- */
.sidebar-overlay{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; }

.app-sidebar{
  width:260px;
  background:var(--sidebar-bg);
  color:var(--sidebar-txt);
  position:fixed;
  top:0; bottom:0; left:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
  border-right:1px solid rgba(255,255,255,0.08);
}

.sidebar-header{
  padding:24px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.brand-title{
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
  color:white;
  text-decoration:none;
}
.brand-title span{ color:var(--red); }

.brand-badge{
  font-size:10px;
  font-weight:800;
  background:var(--red);
  color:white;
  padding:2px 6px;
  border-radius:4px;
  text-transform:uppercase;
}

.sidebar-nav{
  padding:20px 12px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow-y:auto;
}

.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  color:#94a3b8;
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  border-radius:8px;
  transition:all .2s ease;
  cursor:pointer;
  border:none;
  background:none;
  width:100%;
  text-align:left;
}

.nav-item:hover{
  background:rgba(255,255,255,0.06);
  color:white;
}

.nav-item.active{
  background:linear-gradient(90deg, var(--navy), #2563eb);
  color:white;
  box-shadow:0 4px 12px rgba(37,99,235,0.3);
}

.nav-item .icon{ font-size:18px; width:22px; text-align:center; }

.sidebar-footer{
  padding:16px;
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.user-profile-chip{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;
}

.avatar-circle{
  width:36px;
  height:36px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:14px;
}

.user-info-text{ display:flex; flex-direction:column; overflow:hidden; }
.user-info-name{ font-size:13px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.user-info-role{ font-size:11px; color:#94a3b8; }

.theme-toggle-btn{
  background:rgba(255,255,255,0.08);
  color:white;
  border:none;
  padding:8px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:background .2s;
}
.theme-toggle-btn:hover{ background:rgba(255,255,255,0.15); }

/* ---------- Main Content Container ---------- */
.app-main{
  flex:1;
  margin-left:260px;
  display:flex;
  flex-direction:column;
  min-width:0;
  transition:margin-left .3s ease;
}

.top-app-bar{
  background:var(--card-bg);
  border-bottom:1px solid var(--border);
  padding:16px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:90;
}

.mobile-hamburger{
  display:none;
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--text);
}

.page-header-title{
  font-size:20px;
  font-weight:800;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:10px;
}

.main-content{ padding:28px; flex:1; }

.crmStrip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
.crmChip{
  background:var(--card-bg);
  border:1px solid var(--border);
  color:var(--navy);
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
}

.viewAsBanner{
  display:none;
  background:#fef3c7;
  color:#92400e;
  padding:12px 18px;
  border-radius:10px;
  margin-bottom:20px;
  font-size:13px;
  font-weight:600;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid #fde68a;
}
.viewAsBanner.show{ display:flex; }

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  margin-bottom:24px;
}

.card{
  background:var(--card-bg);
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.04);
  border:1px solid var(--border);
  transition:transform .2s;
}
.card:hover{ transform:translateY(-2px); }
.card h3{ font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
.card h2{ color:var(--navy); margin-top:8px; font-size:24px; font-weight:800; }
.card.warn h2{ color:var(--danger); }
.card.good h2{ color:var(--success); }

.panel{
  background:var(--card-bg);
  padding:24px;
  border-radius:14px;
  margin-bottom:24px;
  box-shadow:0 4px 16px rgba(0,0,0,0.04);
  border:1px solid var(--border);
}

.panel h2{ color:var(--navy); font-size:16px; font-weight:800; margin-bottom:14px; }

.charts-row{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
@media (max-width:900px){ .charts-row{ grid-template-columns:1fr; } }

.chart-box{
  position:relative;
  height:260px;
  background:var(--card-bg);
  padding:16px;
  border-radius:10px;
  border:1px solid var(--border);
}

.notif-header-wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.notif-header-badge{
  font-size:11px;
  font-weight:800;
  background:var(--navy);
  color:white;
  padding:2px 8px;
  border-radius:12px;
  margin-left:8px;
  vertical-align:middle;
}

.notif-item{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:12px 16px;
  border-left:4px solid var(--warn);
  background:var(--warn-bg);
  margin-bottom:10px;
  font-size:13px;
  border-radius:10px;
  line-height:1.4;
  box-shadow:0 2px 8px rgba(0,0,0,0.02);
  transition:all .2s ease;
}
.notif-item:hover{ transform:translateX(3px); }
.notif-icon{ font-size:16px; flex-shrink:0; margin-top:1px; }
.notif-content{ flex:1; word-break:break-word; }
.notif-item.overdue{ border-left-color:var(--danger); background:var(--danger-bg); }
.notif-item.info{ border-left-color:var(--navy); background:var(--card-bg); border:1px solid var(--border); border-left:4px solid var(--navy); }
.notif-item .who{ color:var(--navy); font-weight:700; }

.notif-toggle-btn{
  background:var(--card-bg);
  color:var(--navy);
  border:1px solid var(--border);
  padding:8px 18px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:all .2s ease;
  display:inline-flex;
  align-items:center;
  gap:6px;
  box-shadow:0 2px 6px rgba(0,0,0,0.04);
}
.notif-toggle-btn:hover{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
  transform:translateY(-1px);
}

.addBtn{
  background:var(--navy);
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:20px;
  font-weight:700;
  box-shadow:0 4px 12px rgba(31,78,121,0.2);
}
.addBtn:hover{ background:var(--navy-dark); }

input, select{
  width:100%;
  padding:10px 12px;
  margin-top:6px;
  margin-bottom:12px;
  box-sizing:border-box;
  background:var(--card-bg);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:8px;
  font-size:13px;
  outline:none;
}
input:focus, select:focus{ border-color:var(--navy); }

.table-wrapper{ overflow-x:auto; border-radius:10px; border:1px solid var(--border); }
table{ width:100%; border-collapse:collapse; background:var(--card-bg); white-space:nowrap; }
th, td{ border-bottom:1px solid var(--border); padding:10px 12px; font-size:12px; text-align:left; }
th{ background:var(--navy); color:white; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
tr.overdue{ background:var(--danger-bg); }
tr.userRow{ cursor:pointer; }
tr.userRow:hover{ background:rgba(0,0,0,0.03); }

.badge-status{ display:inline-block; padding:3px 8px; border-radius:10px; font-weight:700; font-size:11px; }
.badge-pending{ background:var(--badge-pending-bg); color:var(--badge-pending-txt); }
.badge-progress{ background:var(--badge-progress-bg); color:var(--badge-progress-txt); }
.badge-complete{ background:var(--badge-complete-bg); color:var(--badge-complete-txt); }

.searchRow{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.searchRow input{ margin:0; flex:1; min-width:220px; }

.loadMoreBtn{
  background:#64748b;
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
  margin-top:16px;
  font-size:13px;
  font-weight:700;
}

.modalOverlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(3px);
  z-index:200;
  justify-content:center;
  align-items:center;
}
.modalOverlay.show{ display:flex; }

.modalBox{
  background:var(--card-bg);
  padding:28px;
  border-radius:14px;
  width:90%;
  max-width:480px;
  border:1px solid var(--border);
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}
.modalBox h2{ color:var(--navy); margin-bottom:16px; font-size:18px; font-weight:800; }
.modalBox .closeBtn{ background:#64748b; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; margin-top:12px; font-weight:700; }

.stale-note{ font-size:11px; color:var(--muted); margin-top:8px; }

@media (max-width:768px){
  .app-sidebar{ transform:translateX(-100%); }
  .app-sidebar.sidebar-open{ transform:translateX(0); }
  .sidebar-overlay.sidebar-open{ display:block; }
  .app-main{ margin-left:0; }
  .mobile-hamburger{ display:block; }
}


/* ---------- Notifications page extras ---------- */
.notifCard{ display:flex; gap:14px; align-items:flex-start; padding:14px 16px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--card-bg); }
.notifCard.unread{ border-left:4px solid var(--navy); background:var(--bg); }
.notifCard .nIcon{ font-size:20px; }
.notifCard .nBody{ flex:1; }
.notifCard .nTitle{ font-weight:800; font-size:13px; margin-bottom:2px; }
.notifCard .nMsg{ font-size:13px; color:var(--text); margin-bottom:4px; }
.notifCard .nMeta{ font-size:11px; color:var(--muted); }
.notifCard .nActions{ display:flex; flex-direction:column; gap:6px; }
.notifCard button{ font-size:11px; padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); cursor:pointer; }
.notifCard button:hover{ background:var(--navy); color:#fff; border-color:var(--navy); }
.filterTabs{ display:flex; gap:8px; margin-bottom:14px; }
.filterTab{ padding:7px 16px; border-radius:20px; border:1px solid var(--border); background:var(--card-bg); color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; }
.filterTab.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
</style>
</head>

  </div>
</aside>

<div class="app-main">

  <header class="top-app-bar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="mobile-hamburger" onclick="toggleMobileSidebar()">☰</button>
      <h1 class="page-header-title">🔔 Notifications</h1>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="notif-toggle-btn" onclick="markAllRead()">✔ Mark all read</button>

<script>
(function(){
const saved = localStorage.getItem("crm-theme") || "light";
document.documentElement.setAttribute("data-theme", saved);
document.addEventListener("DOMContentLoaded", ()=>{
  const btnText = document.getElementById("themeToggleText");
  if(btnText) btnText.textContent = saved === "dark" ? "Light Theme" : "Dark Theme";
});
})();
function toggleTheme(){
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("crm-theme", next);
  const t = document.getElementById("themeToggleText");
  if(t) t.textContent = next === "dark" ? "Light Theme" : "Dark Theme";
}
function toggleMobileSidebar(){
  const sidebar = document.getElementById("appSidebar");
  const overlay = document.getElementById("sidebarOverlay");
  if(sidebar) sidebar.classList.toggle("sidebar-open");
  if(overlay) overlay.classList.toggle("sidebar-open");
}
</script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";

import { getAuth, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, increment,
onSnapshot, query, orderBy, where, limit, serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

import { getUserProfile, setCachedProfile } from "./js/profile-cache.js";

const firebaseConfig = {
apiKey: "AIzaSyCSa-bvwEaFSz2MKt6AFFUe5QvbSy-7br4",
authDomain: "anurag-kushwaha-projects.firebaseapp.com",
projectId: "anurag-kushwaha-projects",
storageBucket: "anurag-kushwaha-projects.firebasestorage.app",
messagingSenderId: "745347735405",
appId: "1:745347735405:web:7a486753dba3bd499c0464"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentRole = "Viewer";
let currentName = "";
let allUsersMap = {};
let allNotifs = [];
let currentFilter = "all";

function escapeHtml(v){
if(v===undefined||v===null) return "";
return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function timeAgo(ts){
if(!ts || !ts.toDate) return "";
const d = ts.toDate();
const diffSec = Math.round((Date.now()-d.getTime())/1000);
if(diffSec < 60) return "just now";
if(diffSec < 3600) return Math.floor(diffSec/60)+"m ago";
if(diffSec < 86400) return Math.floor(diffSec/3600)+"h ago";
return d.toLocaleDateString()+" "+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}

async function ensureUserDoc(user){
return getUserProfile(db, user, true);
}

async function logActivity(action, details){
try{
await addDoc(collection(db,"activityLogs"), { action, details: details||"", userEmail: currentUser?currentUser.email:"", userName: currentName, timestamp: serverTimestamp() });
}catch(e){}
}

window.logout = async function(){
await logActivity("Logout","");
await signOut(auth);
window.location.href = "index.html";
};

window.setFilter = function(f){
currentFilter = f;
document.querySelectorAll(".filterTab").forEach(b=>b.classList.toggle("active", b.dataset.f===f));
render();
};

window.markRead = async function(id){
try{ await updateDoc(doc(db,"notifications",id), { read:true }); }catch(e){ console.error(e); }
};

window.markAllRead = async function(){
const unread = allNotifs.filter(n=>!n.read);
for(const n of unread){
try{ await updateDoc(doc(db,"notifications",n.id), { read:true }); }catch(e){}
}
};

function render(){
const listEl = document.getElementById("notifList");
let items = allNotifs.slice();
if(currentFilter === "unread") items = items.filter(n=>!n.read);

if(items.length === 0){
listEl.innerHTML = "<div class='stale-note' style='padding:20px 0;text-align:center;'>No notifications to show.</div>";
return;
}

listEl.innerHTML = items.map(n=>{
const who = (currentRole === "Admin" && n.targetUid && allUsersMap[n.targetUid])
  ? `<span class="who">${escapeHtml(allUsersMap[n.targetUid].name || allUsersMap[n.targetUid].email)} — </span>` : "";
return `
<div class="notifCard ${n.read ? "" : "unread"}">
  <div class="nIcon">${n.read ? "📭" : "🔔"}</div>
  <div class="nBody">
    <div class="nTitle">${who}${escapeHtml(n.title)}</div>
    <div class="nMsg">${escapeHtml(n.message)}</div>
    <div class="nMeta">${timeAgo(n.createdAt)}</div>
  </div>
  <div class="nActions">
    ${!n.read ? `<button onclick="markRead('${n.id}')">Mark read</button>` : ""}
  </div>
</div>`;
}).join("");
}

function listenNotifs(){
let q;
if(currentRole === "Admin"){
q = query(collection(db,"notifications"), orderBy("createdAt","desc"), limit(200));
}else{
q = query(collection(db,"notifications"), where("targetUid","==",currentUser.uid), orderBy("createdAt","desc"), limit(100));
}
onSnapshot(q, (snapshot)=>{
allNotifs = [];
snapshot.forEach(d=>allNotifs.push({ id:d.id, ...d.data() }));
render();
}, (error)=>{
document.getElementById("notifList").innerHTML = `<div style="color:var(--danger);">Could not load notifications (${escapeHtml(error.code||error.message)}).</div>`;
});
}

onAuthStateChanged(auth, async (user)=>{
if(!user){ window.location.href = "index.html"; return; }
try{
currentUser = user;
const userData = await ensureUserDoc(user);
if(userData.disabled === true || userData.deleted === true){ await signOut(auth); window.location.href = "index.html"; return; }
currentRole = userData.role || "Viewer";
currentName = userData.name || user.email;
if(window.mooSetUserName) window.mooSetUserName(currentName);

document.getElementById("userNameLabel").textContent = currentName;
document.getElementById("userRoleBadge").textContent = currentRole;
document.getElementById("userAvatar").textContent = (currentName||"U").charAt(0).toUpperCase();

if(currentRole === "Admin"){
  document.getElementById("sidebarAdminLink").style.display = "flex";
  document.getElementById("sidebarMyProjectsLink").style.display = "flex";
  getDocs(collection(db,"users")).then((snapshot)=>{
    allUsersMap = {};
    snapshot.forEach(d=>allUsersMap[d.id]=d.data());
    render();
  }).catch(e=>console.error(e));
}

// Opening this page counts as "seen" — reset the sidebar badge everywhere else.
try{
await setDoc(doc(db,"users",user.uid), { unreadCount: 0 }, { merge:true });
userData.unreadCount = 0;
setCachedProfile(user.uid, userData);
}catch(e){ console.error(e); }

listenNotifs();

}catch(error){
console.error("Notifications init error:", error);
}
});

</script>

<script src="js/assistant-config.js"></script>
<script src="js/assistant-widget.js"></script>

</body>
</html>
